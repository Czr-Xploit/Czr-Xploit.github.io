# =============================================================================
# Sveltia CMS — configuracion para CzrXplo1t
# =============================================================================
#
# SETUP (una sola vez):
#
#   1. Crea una GitHub OAuth App:
#      https://github.com/settings/developers  >  New OAuth App
#
#      - Application name:    CzrXplo1t CMS
#      - Homepage URL:        https://czr-xploit.github.io
#      - Callback URL:        https://czr-xploit.github.io/admin/
#
#      Copia el Client ID (NO necesitas Client Secret para PKCE, pero si para
#      el proxy OAuth — ver paso 2).
#
#   2. Despliega sveltia-cms-auth en Cloudflare Workers (gratis):
#      https://github.com/sveltia/sveltia-cms-auth
#
#      Necesitas el Client ID y Client Secret del paso 1.
#      El worker se despliega en ~5 minutos y te da una URL tipo:
#      https://tu-worker.tu-cuenta.workers.dev
#
#   3. Pon esa URL abajo en base_url.
#
# =============================================================================

backend:
  name: github
  repo: Czr-Xploit/Czr-Xploit.github.io
  branch: main
  # Pon aqui la URL de tu Cloudflare Worker (sveltia-cms-auth)
  base_url: https://CAMBIA-ESTO.workers.dev
  auth_endpoint: oauth

# Donde se guardan las imagenes subidas desde el CMS
media_folder: "theme/static/media"
public_folder: "/static/media"

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# =============================================================================
# Colecciones
# =============================================================================

collections:

  # ---------------------------------------------------------------------------
  # Articulos de investigacion — Espanol
  # ---------------------------------------------------------------------------
  - name: posts-es
    label: "Articulos (ES)"
    label_singular: "Articulo (ES)"
    folder: "content/posts/es"
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    summary: "{{title}}  —  {{date}}"
    view_filters:
      - { label: "Destacados", field: featured, pattern: true }
      - { label: "Borradores", field: draft, pattern: true }
    fields:
      - label: "Titulo"
        name: title
        widget: string
        required: true
      - label: "Slug"
        name: slug
        widget: string
        required: true
        pattern: ['^[a-z0-9][a-z0-9-]*[a-z0-9]$', "Solo minusculas, numeros y guiones"]
      - label: "Idioma"
        name: lang
        widget: hidden
        default: "es"
      - label: "Clave de traduccion"
        name: translation_key
        widget: string
        required: true
        hint: "Usa la misma clave en la version EN para enlazar ambos articulos"
      - label: "Tipo"
        name: type
        widget: hidden
        default: "research"
      - label: "Fecha"
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: true
      - label: "Actualizado"
        name: updated
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: "Destacado"
        name: featured
        widget: boolean
        default: false
      - label: "Fijado"
        name: pinned
        widget: boolean
        default: false
      - label: "Borrador"
        name: draft
        widget: boolean
        default: false
      - label: "Resumen"
        name: summary
        widget: text
        required: true
        hint: "1-2 frases. Aparece en listados, feed y tarjeta social."
      - label: "Tags"
        name: tags
        widget: list
        allow_add: true
        field: { label: "Tag", name: tag, widget: string }
      - label: "Portada"
        name: cover
        widget: image
        required: false
      - label: "Alt de portada"
        name: cover_alt
        widget: string
        required: false
      - label: "Tabla de contenidos"
        name: toc
        widget: boolean
        default: true
      - label: "Contenido"
        name: body
        widget: markdown

  # ---------------------------------------------------------------------------
  # Articulos de investigacion — English
