      - label: "Language"
        name: lang
        widget: hidden
        default: "en"
      - label: "Translation key"
        name: translation_key
        widget: string
        required: true
        hint: "Use the same key as the ES version to link both articles"
      - label: "Type"
        name: type
        widget: hidden
        default: "research"
      - label: "Date"
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: true
      - label: "Updated"
        name: updated
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: "Featured"
        name: featured
        widget: boolean
        default: false
      - label: "Pinned"
        name: pinned
        widget: boolean
        default: false
      - label: "Draft"
        name: draft
        widget: boolean
        default: false
      - label: "Summary"
        name: summary
        widget: text
        required: true
        hint: "1-2 sentences. Used in listings, feed and social card."
      - label: "Tags"
        name: tags
        widget: list
        allow_add: true
        field: { label: "Tag", name: tag, widget: string }
      - label: "Cover"
        name: cover
        widget: image
        required: false
      - label: "Cover alt"
        name: cover_alt
        widget: string
        required: false
      - label: "Table of contents"
        name: toc
        widget: boolean
        default: true
      - label: "Content"
        name: body
        widget: markdown

