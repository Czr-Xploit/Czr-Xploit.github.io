<div class="palette" id="palette" hidden>
  <div class="palette-backdrop" data-action="close-palette"></div>

  <div class="palette-panel" role="dialog" aria-modal="true" aria-labelledby="palette-label">
    <h2 class="sr-only" id="palette-label">{{ t.palette_title }}</h2>

    <div class="palette-input-row">
      <span class="palette-prompt" aria-hidden="true">&gt;</span>
      <input type="search" class="palette-input" id="palette-input"
             placeholder="{{ t.search_placeholder }}" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="false"
             aria-controls="palette-results" aria-autocomplete="list" aria-describedby="palette-hint" />
      <button type="button" class="palette-close" data-action="close-palette" aria-label="Esc">esc</button>
    </div>

    <p class="palette-hint" id="palette-hint">{{ t.search_hint }}</p>

    <ul class="palette-results" id="palette-results" role="listbox" aria-label="{{ t.search_results_count }}"></ul>

    <p class="palette-status" id="palette-status" role="status" aria-live="polite"></p>

    <div class="palette-legend" aria-hidden="true">
      <span><kbd>↑</kbd><kbd>↓</kbd> mover</span>
      <span><kbd>↵</kbd> abrir</span>
      <span><kbd>esc</kbd> cerrar</span>
    </div>
  </div>
</div>
